name: Android Export

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Export debug APK
        run: |
          mkdir -p exports
          godot --headless --path . --export-debug "Android" exports/saboteur92.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saboteur92-debug-apk
          path: exports/saboteur92.apk
