name: Android Export

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GDScript
        run: |
          set -euo pipefail
          pip3 install --user gdtoolkit==4.5.0
          export PATH="$HOME/.local/bin:$PATH"
          gdlint scripts/ test/

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          # Pin matches project.godot config/features=4.6 (Godot 4.6.stable).
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Godot editor settings
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "${SDK}"
          test -n "${JAVA_HOME}"
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"${SDK}\""
            echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
          } > ~/.config/godot/editor_settings-4.6.tres
          echo "android_sdk_path=${SDK}"
          echo "java_sdk_path=${JAVA_HOME}"

      - name: Smoke run
        run: |
          set -euo pipefail
          godot --headless --import
          godot --headless --quit-after 300 2>&1 | tee run.log
          # Engine ERROR: lines from res:// are project bugs (missing autoload,
          # failed texture load). Driver/environment noise (ALSA, adb) is not.
          if grep "ERROR:" run.log | grep -q "res://"; then
            echo "Smoke run logged a project ERROR"
            grep "ERROR:" run.log || true
            exit 1
          fi

      - name: Unit tests (GUT)
        run: |
          set -euo pipefail
          # GUT 9.6.1 is the Godot 4.6 release. Smoke already imported the
          # project; -gexit fails the job when any test fails.
          godot --headless -s addons/gut/gut_cmdln.gd -gexit 2>&1 | tee gut.log
          grep -q "Totals" gut.log

      - name: Mission playthrough
        run: |
          set -euo pipefail
          # Autopilot in scripts/demo/mission_demo.gd. Game-time cap is 120s;
          # wall-clock timeout is a safety net if quit() never runs. Do not use
          # --quit-after here: headless FPS is uncapped, so a frame cap fires
          # before the ~85s spawn-to-exit walk finishes.
          timeout --signal=KILL 240 godot --headless -- --demo 2>&1 | tee mission-demo.log
          if ! grep -q "\\[Demo\\] Mission complete" mission-demo.log; then
            echo "Mission playthrough did not complete"
            grep "\\[Demo\\] FAIL" mission-demo.log || true
            exit 1
          fi

      - name: Fuse expiry is a loss
        run: |
          set -euo pipefail
          timeout --signal=KILL 180 godot --headless -- --demo-fuse 2>&1 | tee mission-fuse.log
          if ! grep -q "\\[Demo\\] Fuse loss OK" mission-fuse.log; then
            echo "Fuse-loss probe did not fail the mission"
            grep "\\[Demo\\] FAIL" mission-fuse.log || true
            exit 1
          fi

      - name: Audit world collision
        run: |
          set -euo pipefail
          pip3 install --user -r tools/requirements.txt
          python3 tools/saboteur_rip/audit_collision.py | tee collision-audit.log
          python3 -c "import re,sys; t=open('collision-audit.log').read(); m=re.search(r'\[грунт \(speckled\)\].*?interior\s+всего\s+\d+, дыр\s+(\d+)', t, re.S); assert m and int(m.group(1))==0, 'interior speckled-earth holes are not zero'"

      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p exports
          godot --headless --path . \
            --install-android-build-template \
            --export-debug "Android" exports/saboteur92.apk
          test -s exports/saboteur92.apk
          unzip -t exports/saboteur92.apk
          unzip -l exports/saboteur92.apk | tee apk-list.txt
          grep -q "classes.dex" apk-list.txt
          grep -q "assets/" apk-list.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saboteur92-debug-apk
          path: exports/saboteur92.apk
